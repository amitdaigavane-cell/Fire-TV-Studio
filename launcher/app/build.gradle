plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    lint {
        // Private sideloaded Fire OS app; not submitted to Google Play.
        disable 'ExpiredTargetSdkVersion'
    }

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 29
        versionCode 17
        versionName '4.7.1'
        testInstrumentationRunner 'com.gathin.tvhome.HomeVisualTest'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // Wallpapers belong to users; no personal image is shipped in either APK.
    sourceSets.main.java.srcDir '../common/src/main/java'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {


}
